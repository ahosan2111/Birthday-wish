<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Nadia 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      position: relative;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      filter: blur(80px);
      animation: glow 5s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(0.8);
      }
      to {
        transform: scale(1.3);
      }
    }

    /* Main Card */
    .card {
      width: 90%;
      max-width: 550px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      color: white;
      position: relative;
      z-index: 10;
      animation: cardIn 1.2s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cake {
      font-size: 75px;
      animation: cakeBounce 1.5s infinite ease-in-out;
      margin-bottom: 10px;
    }

    @keyframes cakeBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      font-size: clamp(35px, 9vw, 60px);
      line-height: 1.1;
      margin-bottom: 15px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .name {
      color: #fff700;
      text-shadow: 0 0 15px rgba(255,247,0,0.7);
    }

    .subtitle {
      font-size: clamp(16px, 4vw, 20px);
      line-height: 1.7;
      margin: 10px auto 25px;
      max-width: 450px;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .button {
      border: none;
      padding: 14px 30px;
      border-radius: 50px;
      background: white;
      color: #d63384;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .button:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 35px rgba(255,255,255,0.4);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 5;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Floating balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      font-size: 60px;
      animation: balloonFloat linear infinite;
      opacity: 0.85;
      z-index: 1;
    }

    @keyframes balloonFloat {
      from {
        transform: translateY(0) rotate(-5deg);
      }

      to {
        transform: translateY(-120vh) rotate(10deg);
      }
    }

    .balloon:nth-child(1) {
      left: 5%;
      animation-duration: 12s;
    }

    .balloon:nth-child(2) {
      left: 25%;
      animation-duration: 15s;
      animation-delay: 2s;
    }

    .balloon:nth-child(3) {
      right: 20%;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .balloon:nth-child(4) {
      right: 5%;
      animation-duration: 16s;
      animation-delay: 4s;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 60px;
      }

      .message {
        font-size: 15px;
      }

      .balloon {
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating Balloons -->
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>

  <!-- Birthday Card -->
  <div class="card">

    <div class="cake">🎂</div>

    <h1>
      Happy Birthday <span class="name">Nadia!</span> 🎉
    </h1>

    <p class="subtitle">
      Wishing you a day filled with love, happiness, laughter & beautiful memories! 💖
    </p>

    <p class="message">
      May this new year of your life bring you endless happiness,
      success, good health and everything your heart wishes for. ✨
      Keep smiling and keep shining! 🌸
    </p>

    <button class="button" onclick="celebrate()">
      🎁 Click for a Surprise
    </button>

  </div>

  <script>

    /* Confetti Generator */
    function createConfetti(amount = 100) {

      const colors = [
        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#eccc68",
        "#ff6b81",
        "#a55eea",
        "#ffffff"
      ];

      for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 7 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    /* Surprise Button */
    function celebrate() {

      createConfetti(250);

      alert(
        "🎉 Happy Birthday Nadia! May all your dreams come true! ❤️"
      );

    }

    /* Automatic Confetti */
    createConfetti(150);

    /* More confetti every few seconds */
    setInterval(() => {
      createConfetti(40);
    }, 5000);

  </script>

</body>
</html>
